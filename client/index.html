<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Kikel Ru</title>
    <script>
      window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches
        ? document.documentElement.classList.add('dark-theme')
        : document.documentElement.classList.add('light-theme');
    </script>
  </head>
  <body>
    <div id="app">
      <style>
        html.dark-theme {
          background: #000;
          color: #fff;
        }
        html.light-theme {
          background: #fff;
          color: #000;
        }
      </style>
    </div>
    <script
      type="module"
      src="main.js"></script>
  </body>
</html>
